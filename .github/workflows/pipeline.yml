# Integración continua: cada push o pull request ejecuta el pipeline completo
# en un servidor limpio de GitHub. Sirve como evidencia de reproducibilidad.
name: pipeline-iris

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Ejecutar pipeline completo (un solo comando)
        run: make all

      - name: Guardar evidencia de ejecución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-pipeline
          path: |
            reports/
